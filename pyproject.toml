[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-digest"
version = "1.0.0"
description = "Daily arXiv scrape + DeepSeek curation for pharma computational chemistry"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.1",
  "discord.py>=2.3.0",
]

[project.scripts]
arxiv-digest = "arxiv_digest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
